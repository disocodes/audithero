[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audithero-schads"
version = "1.1.3"
description = "Cross-platform SCHADS payroll audit engine for Databricks and Microsoft Fabric"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "requests>=2.32",
  "holidays>=0.75",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
