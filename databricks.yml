bundle:
  name: audithero
  engine: direct
  databricks_cli_version: '>= 1.3.0'

include:
  - resources/*.yml

variables:
  catalog:
    default: schads_payroll
  secret_scope:
    default: audithero
  sql_warehouse_id:
    description: Databricks SQL warehouse ID used by AI/BI and Genie
  accounts_email:
    description: Workspace user/email receiving the monthly payroll dashboard snapshot
    default: ${workspace.current_user.userName}
  monthly_cron:
    default: "0 0 9 25 * ?"
  timezone:
    default: Australia/Perth

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  include:
    - notebooks/**
    - src/**
    - rules/**
    - config/**
    - genie/**

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
