resources:
  jobs:
    audithero_historical_complete:
      name: "AuditHero - Historical SCHADS Audit (Complete)"
      parameters:
        - name: start_date
          default: "2023-07-01"
        - name: end_date
          default: "2026-06-30"
        - name: actual_pay_source
          default: "PAYROLL_API"
      tasks:
        - task_key: full_historical_audit
          notebook_task:
            notebook_path: ../notebooks/10_historical_audit_complete.py
            base_parameters:
              catalog: ${var.catalog}
              secret_scope: ${var.secret_scope}
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              actual_pay_source: "{{job.parameters.actual_pay_source}}"
          max_retries: 1
          min_retry_interval_millis: 30000

    audithero_monthly_complete:
      name: "AuditHero - Monthly Payroll Audit (Complete)"
      tasks:
        - task_key: full_monthly_audit
          notebook_task:
            notebook_path: ../notebooks/11_monthly_payroll_audit_complete.py
            base_parameters:
              catalog: ${var.catalog}
              secret_scope: ${var.secret_scope}
              period_mode: "RECENT_45_DAYS"
              actual_pay_source: "PAYROLL_API"
          max_retries: 1
          min_retry_interval_millis: 30000
      schedule:
        quartz_cron_expression: ${var.monthly_cron}
        timezone_id: ${var.timezone}
        pause_status: PAUSED
