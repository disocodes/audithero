resources:
  jobs:
    setup:
      name: "AuditHero - Setup"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
            base_parameters:
              catalog: "${var.catalog}"
              sql_warehouse_id: "${var.sql_warehouse_id}"
        - task_key: validate_rules
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: ../notebooks/01_validate_rules.py}
        - task_key: self_test
          depends_on: [{task_key: validate_rules}]
          notebook_task: {notebook_path: ../notebooks/01b_self_test.py}
        - task_key: setup_investigation_view
          depends_on: [{task_key: self_test}]
          notebook_task:
            notebook_path: ../notebooks/00e_setup_investigation_view.py
            base_parameters: {catalog: "${var.catalog}"}
        - task_key: verify_dashboard
          depends_on: [{task_key: setup_investigation_view}]
          notebook_task:
            notebook_path: ../notebooks/00d_verify_dashboard.py
            base_parameters:
              catalog: "${var.catalog}"
              sql_warehouse_id: "${var.sql_warehouse_id}"

    self_test:
      name: "AuditHero - Self Test"
      tasks:
        - task_key: self_test
          notebook_task: {notebook_path: ../notebooks/01b_self_test.py}

    auto_file_preview:
      name: "AuditHero - Preview Uploaded Files"
      parameters:
        - {name: source_root, default: "/Volumes/${var.catalog}/bronze/landing/import/raw"}
        - {name: start_date, default: ""}
        - {name: end_date, default: ""}
      tasks:
        - task_key: preview_and_prepare
          notebook_task:
            notebook_path: ../notebooks/02f_auto_intake.py
            base_parameters:
              catalog: "${var.catalog}"
              source_root: "{{job.parameters.source_root}}"
              output_root: "/Volumes/${var.catalog}/bronze/landing/auto_input"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"

    prepared_file_audit:
      name: "AuditHero - Audit Reviewed Uploaded Files"
      parameters:
        - {name: input_root, default: "/Volumes/${var.catalog}/bronze/landing/auto_input"}
        - {name: start_date, default: ""}
        - {name: end_date, default: ""}
      tasks:
        - task_key: audit_reviewed_files
          notebook_task:
            notebook_path: ../notebooks/03b_manual_file_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.input_root}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              run_type: "AUTO_FILE"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_dashboard
          depends_on: [{task_key: audit_reviewed_files}]
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}

    source_mapping_draft:
      name: "AuditHero - Build Source Mapping Workbook (Advanced)"
      parameters:
        - {name: source_root, default: "/Volumes/${var.catalog}/bronze/landing/import/raw"}
        - {name: draft_path, default: "/Volumes/${var.catalog}/bronze/landing/import/source_mapping_draft.xlsx"}
        - {name: overwrite, default: "false"}
      tasks:
        - task_key: inspect_and_suggest
          notebook_task:
            notebook_path: ../notebooks/02d_source_mapping_draft.py
            base_parameters:
              catalog: "${var.catalog}"
              source_root: "{{job.parameters.source_root}}"
              draft_path: "{{job.parameters.draft_path}}"
              overwrite: "{{job.parameters.overwrite}}"

    source_file_convert:
      name: "AuditHero - Convert Source Files (Advanced)"
      parameters:
        - {name: source_root, default: "/Volumes/${var.catalog}/bronze/landing/import/raw"}
        - {name: mapping_path, default: "/Volumes/${var.catalog}/bronze/landing/import/source_mapping.xlsx"}
        - {name: output_root, default: "/Volumes/${var.catalog}/bronze/landing/input"}
        - {name: strict, default: "true"}
      tasks:
        - task_key: convert_and_validate
          notebook_task:
            notebook_path: ../notebooks/02e_convert_source_files.py
            base_parameters:
              catalog: "${var.catalog}"
              source_root: "{{job.parameters.source_root}}"
              mapping_path: "{{job.parameters.mapping_path}}"
              output_root: "{{job.parameters.output_root}}"
              strict: "{{job.parameters.strict}}"

    mapped_import_audit:
      name: "AuditHero - Convert Mapped Files and Run Audit (Advanced)"
      parameters:
        - {name: source_root, default: "/Volumes/${var.catalog}/bronze/landing/import/raw"}
        - {name: mapping_path, default: "/Volumes/${var.catalog}/bronze/landing/import/source_mapping.xlsx"}
        - {name: output_root, default: "/Volumes/${var.catalog}/bronze/landing/input"}
        - {name: strict, default: "true"}
        - {name: start_date, default: "2023-07-01"}
        - {name: end_date, default: "2026-06-30"}
      tasks:
        - task_key: convert_source_files
          notebook_task:
            notebook_path: ../notebooks/02e_convert_source_files.py
            base_parameters:
              catalog: "${var.catalog}"
              source_root: "{{job.parameters.source_root}}"
              mapping_path: "{{job.parameters.mapping_path}}"
              output_root: "{{job.parameters.output_root}}"
              strict: "{{job.parameters.strict}}"
        - task_key: audit_converted_files
          depends_on: [{task_key: convert_source_files}]
          notebook_task:
            notebook_path: ../notebooks/03b_manual_file_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.output_root}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              run_type: "MAPPED_FILE"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_dashboard
          depends_on: [{task_key: audit_converted_files}]
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}

    file_readiness:
      name: "AuditHero - File Readiness (Advanced)"
      parameters:
        - {name: input_root, default: "/Volumes/${var.catalog}/bronze/landing/input"}
      tasks:
        - task_key: validate_uploaded_files
          notebook_task:
            notebook_path: ../notebooks/02c_file_readiness.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.input_root}}"

    manual_file_audit:
      name: "AuditHero - Audit Canonical CSV Excel (Advanced)"
      parameters:
        - {name: input_root, default: "/Volumes/${var.catalog}/bronze/landing/input"}
        - {name: start_date, default: "2023-07-01"}
        - {name: end_date, default: "2026-06-30"}
      tasks:
        - task_key: validate_uploaded_files
          notebook_task:
            notebook_path: ../notebooks/02c_file_readiness.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.input_root}}"
        - task_key: audit_uploaded_files
          depends_on: [{task_key: validate_uploaded_files}]
          notebook_task:
            notebook_path: ../notebooks/03b_manual_file_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.input_root}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              run_type: "MANUAL_FILE"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_dashboard
          depends_on: [{task_key: audit_uploaded_files}]
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}

    connection_test:
      name: "AuditHero - Employment Hero Connection Test (Optional API)"
      tasks:
        - task_key: test
          notebook_task:
            notebook_path: ../notebooks/02_test_employment_hero.py
            base_parameters: {secret_scope: "${var.secret_scope}"}

    audit_readiness:
      name: "AuditHero - API Audit Readiness (Optional API)"
      tasks:
        - task_key: readiness
          notebook_task:
            notebook_path: ../notebooks/02b_audit_readiness.py
            base_parameters:
              catalog: "${var.catalog}"
              secret_scope: "${var.secret_scope}"

    historical_audit:
      name: "AuditHero - Historical SCHADS Audit (Optional API)"
      parameters:
        - {name: start_date, default: "2023-07-01"}
        - {name: end_date, default: "2026-06-30"}
        - {name: actual_pay_source, default: "PAYROLL_API"}
      tasks:
        - task_key: audit
          notebook_task:
            notebook_path: ../notebooks/03_historical_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              secret_scope: "${var.secret_scope}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              actual_pay_source: "{{job.parameters.actual_pay_source}}"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_dashboard
          depends_on: [{task_key: audit}]
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}

    monthly_audit:
      name: "AuditHero - Monthly Payroll Audit (Optional API)"
      tasks:
        - task_key: audit
          notebook_task:
            notebook_path: ../notebooks/04_monthly_payroll_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              secret_scope: "${var.secret_scope}"
              lookback_days: "45"
              actual_pay_source: "PAYROLL_API"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_and_send_dashboard
          depends_on: [{task_key: audit}]
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}
            subscription:
              custom_subject: "AuditHero monthly SCHADS payroll audit"
              paused: false
              subscribers:
                - user_name: ${var.accounts_email}
      schedule:
        quartz_cron_expression: "${var.monthly_cron}"
        timezone_id: "${var.timezone}"
        pause_status: PAUSED
