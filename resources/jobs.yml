resources:
  jobs:
    setup:
      name: "AuditHero - Setup"
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
            base_parameters:
              catalog: "${var.catalog}"
        - task_key: validate_rules
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/01_validate_rules.py
        - task_key: self_test
          depends_on:
            - task_key: validate_rules
          notebook_task:
            notebook_path: ../notebooks/01b_self_test.py

    self_test:
      name: "AuditHero - Self Test"
      tasks:
        - task_key: self_test
          notebook_task:
            notebook_path: ../notebooks/01b_self_test.py

    source_mapping_draft:
      name: "AuditHero - Build Source Mapping Workbook"
      parameters:
        - name: source_root
          default: ""
        - name: draft_path
          default: ""
        - name: overwrite
          default: "false"
      tasks:
        - task_key: inspect_and_suggest
          notebook_task:
            notebook_path: ../notebooks/02d_source_mapping_draft.py
            base_parameters:
              catalog: "${var.catalog}"
              source_root: "{{job.parameters.source_root}}"
              draft_path: "{{job.parameters.draft_path}}"
              overwrite: "{{job.parameters.overwrite}}"

    source_file_convert:
      name: "AuditHero - Convert Source Files"
      parameters:
        - name: source_root
          default: ""
        - name: mapping_path
          default: ""
        - name: output_root
          default: ""
        - name: strict
          default: "true"
      tasks:
        - task_key: convert_and_validate
          notebook_task:
            notebook_path: ../notebooks/02e_convert_source_files.py
            base_parameters:
              catalog: "${var.catalog}"
              source_root: "{{job.parameters.source_root}}"
              mapping_path: "{{job.parameters.mapping_path}}"
              output_root: "{{job.parameters.output_root}}"
              strict: "{{job.parameters.strict}}"

    file_readiness:
      name: "AuditHero - File Readiness"
      parameters:
        - name: input_root
          default: ""
      tasks:
        - task_key: validate_uploaded_files
          notebook_task:
            notebook_path: ../notebooks/02c_file_readiness.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.input_root}}"

    manual_file_audit:
      name: "AuditHero - Audit Uploaded CSV Excel"
      parameters:
        - name: input_root
          default: ""
        - name: start_date
          default: "2023-07-01"
        - name: end_date
          default: "2026-06-30"
      tasks:
        - task_key: validate_uploaded_files
          notebook_task:
            notebook_path: ../notebooks/02c_file_readiness.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.input_root}}"
        - task_key: audit_uploaded_files
          depends_on:
            - task_key: validate_uploaded_files
          notebook_task:
            notebook_path: ../notebooks/03b_manual_file_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              input_root: "{{job.parameters.input_root}}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_dashboard
          depends_on:
            - task_key: audit_uploaded_files
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}

    connection_test:
      name: "AuditHero - Employment Hero Connection Test (Optional API)"
      tasks:
        - task_key: test
          notebook_task:
            notebook_path: ../notebooks/02_test_employment_hero.py
            base_parameters:
              secret_scope: "${var.secret_scope}"

    audit_readiness:
      name: "AuditHero - API Audit Readiness (Optional API)"
      tasks:
        - task_key: readiness
          notebook_task:
            notebook_path: ../notebooks/02b_audit_readiness.py
            base_parameters:
              catalog: "${var.catalog}"
              secret_scope: "${var.secret_scope}"

    historical_audit:
      name: "AuditHero - Historical SCHADS Audit (Optional API)"
      parameters:
        - name: start_date
          default: "2023-07-01"
        - name: end_date
          default: "2026-06-30"
        - name: actual_pay_source
          default: "PAYROLL_API"
      tasks:
        - task_key: audit
          notebook_task:
            notebook_path: ../notebooks/03_historical_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              secret_scope: "${var.secret_scope}"
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
              actual_pay_source: "{{job.parameters.actual_pay_source}}"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_dashboard
          depends_on:
            - task_key: audit
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}

    monthly_audit:
      name: "AuditHero - Monthly Payroll Audit (Optional API)"
      tasks:
        - task_key: audit
          notebook_task:
            notebook_path: ../notebooks/04_monthly_payroll_audit.py
            base_parameters:
              catalog: "${var.catalog}"
              secret_scope: "${var.secret_scope}"
              lookback_days: "45"
              actual_pay_source: "PAYROLL_API"
          max_retries: 1
          min_retry_interval_millis: 30000
        - task_key: refresh_and_send_dashboard
          depends_on:
            - task_key: audit
          dashboard_task:
            dashboard_id: ${resources.dashboards.payroll_compliance.id}
            warehouse_id: ${var.sql_warehouse_id}
            subscription:
              custom_subject: "AuditHero monthly SCHADS payroll audit"
              paused: false
              subscribers:
                - user_name: ${var.accounts_email}
      schedule:
        quartz_cron_expression: "${var.monthly_cron}"
        timezone_id: "${var.timezone}"
        pause_status: PAUSED
